<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Yönetimi - Bakkal App Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #34495e;
            --bg-dark: #0f172a;
            --card-glass: rgba(255, 255, 255, 0.05);
            --sidebar-glass: rgba(15, 23, 42, 0.8);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            display: flex;
        }

        .sidebar {
            width: 280px;
            height: 100vh;
            background: var(--sidebar-glass);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            left: 0;
            top: 0;
            padding: 30px 20px;
        }

        .sidebar-brand {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 50px;
            text-align: center;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-link {
            color: #94a3b8;
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .menu-link:hover,
        .menu-link.active {
            background: rgba(46, 204, 113, 0.1);
            color: var(--primary);
            text-decoration: none;
        }

        .main-content {
            margin-left: 280px;
            padding: 40px;
            width: calc(100% - 280px);
            min-height: 100vh;
        }

        .table-card {
            background: var(--card-glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
        }

        .table {
            color: #f8fafc;
        }

        .table thead th {
            border: none;
            color: #64748b;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .table td {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            vertical-align: middle;
        }

        .role-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .role-admin {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
        }

        .role-user {
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-brand">BAKKAL</div>
        <ul class="list-unstyled">
            <li><a href="/admin/dashboard" class="menu-link"><i class="fas fa-chart-line mr-3"></i> Dashboard</a></li>
            <li><a href="/admin/products" class="menu-link"><i class="fas fa-box mr-3"></i> Ürün Yönetimi</a></li>
            <li><a href="/admin/orders" class="menu-link"><i class="fas fa-shopping-bag mr-3"></i> Siparişler</a></li>
            <li><a href="/admin/users" class="menu-link active"><i class="fas fa-users mr-3"></i> Kullanıcılar</a></li>
            <li><a href="/home" class="menu-link"><i class="fas fa-external-link-alt mr-3"></i> Siteye Dön</a></li>
        </ul>
    </div>

    <main class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="font-weight-bold">Kullanıcı Yönetimi</h1>
            <div class="text-muted">Toplam <span th:text="${#lists.size(users)}">0</span> Üye</div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>AD SOYAD</th>
                            <th>KULLANICI ADI</th>
                            <th>E-POSTA</th>
                            <th>TELEFON</th>
                            <th>ROL</th>
                            <th>ADRES</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td class="font-weight-bold" th:text="${u.name}">Ad Soyad</td>
                            <td th:text="${u.username}">username</td>
                            <td th:text="${u.email}">email</td>
                            <td th:text="${u.phoneNumber}">phone</td>
                            <td>
                                <span th:class="'role-badge ' + (${u.role == 'ADMIN'} ? 'role-admin' : 'role-user')"
                                    th:text="${u.role}">USER</span>
                            </td>
                            <td class="small text-muted"
                                style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                                th:text="${u.address ?: '-'}">Adres</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>

</html>
