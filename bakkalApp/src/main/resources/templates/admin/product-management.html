<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ürün Yönetimi - Bakkal App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #34495e;
            --accent: #3498db;
            --bg-dark: #0f172a;
            --card-glass: rgba(255, 255, 255, 0.05);
            --sidebar-glass: rgba(15, 23, 42, 0.8);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            margin: 0;
            display: flex;
        }

        /* Sidebar Copy from Dashboard */
        .sidebar {
            width: 280px;
            height: 100vh;
            background: var(--sidebar-glass);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            left: 0;
            top: 0;
            padding: 30px 20px;
            z-index: 1000;
        }

        .sidebar-brand {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 50px;
            text-align: center;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
        }

        .menu-link {
            color: #94a3b8;
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .menu-link:hover,
        .menu-link.active {
            background: rgba(46, 204, 113, 0.1);
            color: var(--primary);
            transform: translateX(5px);
            text-decoration: none;
        }

        .menu-link i {
            margin-right: 15px;
            font-size: 1.2rem;
        }

        .main-content {
            margin-left: 280px;
            padding: 40px;
            width: calc(100% - 280px);
            min-height: 100vh;
        }

        .custom-card {
            background: var(--card-glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .table {
            color: #f8fafc;
        }

        .table thead th {
            border-top: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #64748b;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .table td {
            vertical-align: middle;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
        }

        .btn-premium {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            border: none;
            color: white;
            border-radius: 12px;
            padding: 10px 24px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.2);
            color: white;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            padding: 12px;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: var(--primary);
            box-shadow: none;
        }

        label {
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .modal-content {
            background: #1e293b;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-store"></i> BAKKAL
        </div>
        <ul class="sidebar-menu">
            <li class="menu-item"><a href="/admin/dashboard" class="menu-link"><i class="fas fa-chart-line"></i>
                    Dashboard</a></li>
            <li class="menu-item"><a href="/admin/products" class="menu-link active"><i class="fas fa-box"></i> Ürün
                    Yönetimi</a></li>
            <li class="menu-item"><a href="/admin/orders" class="menu-link"><i class="fas fa-shopping-bag"></i>
                    Siparişler</a></li>
            <li class="menu-item"><a href="/admin/users" class="menu-link"><i class="fas fa-users"></i> Kullanıcılar</a>
            </li>
            <li class="menu-item"><a href="/home" class="menu-link"><i class="fas fa-external-link-alt"></i> Siteye
                    Dön</a></li>
        </ul>
        <div style="position: absolute; bottom: 30px; width: calc(100% - 40px);">
            <form action="/logout" method="POST">
                <button type="submit" class="menu-link w-100" style="background: none; border: none; text-align: left;">
                    <i class="fas fa-sign-out-alt"></i> Çıkış Yap
                </button>
            </form>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h2 style="font-weight: 700; margin-bottom: 5px;">Ürün Yönetimi</h2>
                <p style="color: #64748b; font-weight: 500;">Stok durumunu ve ürün bilgilerini güncelleyin</p>
            </div>
            <button class="btn btn-premium" data-toggle="modal" data-target="#addProductModal">
                <i class="fas fa-plus mr-2"></i> Yeni Ürün Ekle
            </button>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${successMessage}" class="alert alert-success border-0 shadow-sm"
            style="background: rgba(46, 204, 113, 0.1); color: #2ecc71; border-radius: 15px;">
            <i class="fas fa-check-circle mr-2"></i> <span th:text="${successMessage}"></span>
        </div>

        <div class="custom-card">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ÜRÜN ADI</th>
                            <th>BARKOD</th>
                            <th>FİYAT</th>
                            <th>STOK</th>
                            <th>AÇIKLAMA</th>
                            <th>İŞLEMLER</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td style="font-weight: 600;" th:text="${product.name}">Ürün Adı</td>
                            <td class="text-muted" th:text="${product.barcode}">Barkod</td>
                            <td th:text="${#numbers.formatDecimal(product.price, 1, 2)} + ' ₺'">0.00 ₺</td>
                            <td>
                                <span th:class="${product.stockQuantity < 10 ? 'text-warning' : 'text-success'}"
                                    style="font-weight: 700;" th:text="${product.stockQuantity}">0</span>
                            </td>
                            <td class="small text-muted"
                                style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                                th:text="${product.description}">Açıklama</td>
                            <td>
                                <div class="d-flex">
                                    <button class="btn btn-sm btn-outline-info border-0 mr-2" data-toggle="modal"
                                        data-target="#editModal" th:onclick="'fillEditModal(' + ${product.id} + ')' ">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <form th:action="@{/admin/products/delete/} + ${product.id}" method="POST">
                                        <button type="submit" class="btn btn-sm btn-outline-danger border-0"
                                            onclick="return confirm('Silmek istediğinize emin misiniz?')">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title font-weight-bold">Yeni Ürün Ekle</h5>
                    <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                </div>
                <form th:action="@{/admin/products/save}" method="POST">
                    <div class="modal-body">
                        <div class="form-group">
                            <label>Ürün Adı</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <div class="form-group">
                                    <label>Fiyat (₺)</label>
                                    <input type="number" name="price" step="0.01" class="form-control" required>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-group">
                                    <label>Stok Adedi</label>
                                    <input type="number" name="stockQuantity" class="form-control" required>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Barkod</label>
                            <input type="text" name="barcode" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Açıklama</label>
                            <textarea name="description" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-premium w-100 py-3">Ürünü Kaydet</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function fillEditModal(id) {
            // Simplified for now - usually you'd fetch data or use data elements
            alert('Düzenleme işlevi için ID: ' + id);
        }
    </script>
</body>

</html>
