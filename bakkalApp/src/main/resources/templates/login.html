<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Bakkal App Premium</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #0f172a;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 20% 30%, rgba(16, 185, 129, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 50px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
        }

        .brand-logo {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-logo i {
            transform: rotate(-10deg);
            margin-right: 15px;
        }

        .form-label {
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px 20px;
            color: white;
            height: 60px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            color: white;
        }

        .btn-premium {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 30px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.2);
        }

        .btn-premium:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 50px rgba(16, 185, 129, 0.3);
            background: var(--primary-dark);
            color: white;
        }

        .alert-custom {
            border-radius: 16px;
            border: none;
            padding: 15px;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="brand-logo">
            <i class="fas fa-shopping-basket"></i>BAKKAL
        </div>

        <h2 class="text-white font-weight-bold mb-2">Hoş Geldiniz</h2>
        <p class="text-muted mb-5">Devam etmek için sisteme giriş yapın.</p>

        <!-- Hata/Çıkış Mesajları -->
        <div th:if="${param.error}" class="alert-custom bg-danger text-white">Giriş bilgileri hatalı.</div>
        <div th:if="${param.logout}" class="alert-custom bg-success text-white">Başarıyla çıkış yapıldı.</div>

        <form th:action="@{/login}" method="POST">
            <div class="form-group mb-4">
                <label class="form-label">Kullanıcı Adı</label>
                <input type="text" name="username" class="form-control" placeholder="admin" required>
            </div>
            <div class="form-group mb-4">
                <label class="form-label">Şifre</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-premium">Giriş Yap</button>
        </form>

        <div class="text-center mt-5">
            <p class="text-muted">Hesabınız yok mu? <a th:href="@{/register}"
                    class="text-primary font-weight-bold">Hemen Kayıt Ol</a></p>
        </div>
    </div>

</body>

</html>
