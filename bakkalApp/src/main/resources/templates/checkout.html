<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenli Ödeme - Bakkal App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="description"
        content="Siparişinizi güvenli bir şekilde tamamlayın. Kapıda ödeme seçeneği ile hızlı ve kolay alışveriş.">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f8fafc;
            --text-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            padding-top: 100px;
        }

        .navbar {
            background: var(--glass) !important;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .checkout-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.02);
            overflow: hidden;
        }

        .summary-header {
            background: linear-gradient(135deg, #f1f5f9, #f8fafc);
            padding: 30px;
            border-bottom: 1px solid #f1f5f9;
        }

        .cart-item-premium {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .item-icon {
            width: 50px;
            height: 50px;
            background: #f1f5f9;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .total-box {
            background: var(--text-dark);
            color: white;
            border-radius: 24px;
            padding: 30px;
            margin-top: 30px;
        }

        #pay-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }

        #pay-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(16, 185, 129, 0.4);
            background: var(--primary-dark);
        }

        #pay-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .toast-premium {
            position: fixed;
            top: 120px;
            right: 30px;
            padding: 20px 30px;
            border-radius: 20px;
            color: white;
            font-weight: 700;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            z-index: 9999;
            transform: translateX(150%);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast-premium.show {
            transform: translateX(0);
        }

        .toast-error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .toast-success {
            background: linear-gradient(135deg, #10b981, #059669);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand font-weight-bold text-primary" href="/home"
                style="font-size: 1.5rem; letter-spacing: -1px;">BAKKAL</a>
            <a href="/home" class="btn btn-link text-dark font-weight-bold" style="text-decoration: none;">
                <i class="fas fa-chevron-left mr-2"></i>Alışverişe Dön
            </a>
        </div>
    </nav>
    <main>
        <div class="container mb-5">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="checkout-card">
                        <div class="summary-header text-center">
                            <div class="item-icon mx-auto mb-3" style="width: 70px; height: 70px; font-size: 1.8rem;">
                                <i class="fas fa-shield-check"></i>
                            </div>
                            <h1 id="checkout-title" class="font-weight-bold mb-1" style="font-size: 2.2rem;">Sipariş
                                Özeti</h1>
                            <p class="text-muted mb-0">Güvenli ödeme adımına hoş geldiniz</p>
                        </div>

                        <div class="p-4 p-md-5">
                            <div id="checkout-items">
                                <!-- JS renders items here -->
                            </div>

                            <div class="total-box d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="text-muted small d-block mb-1"
                                        style="color: #94a3b8 !important;">Ödenecek
                                        Toplam</span>
                                    <h2 class="font-weight-bold mb-0" id="total-amount">0.00 ₺</h2>
                                </div>
                                <i class="fas fa-receipt fa-2x opacity-50"></i>
                            </div>

                            <div class="mt-5">
                                <h5 class="font-weight-bold mb-4">Ödeme Yöntemi</h5>
                                <div class="p-3 border rounded-xl d-flex align-items-center mb-4"
                                    style="border-radius: 20px; background: #f8fafc;">
                                    <i class="fas fa-truck-fast text-primary mr-3 fa-lg"></i>
                                    <div>
                                        <div class="font-weight-bold">Kapıda Ödeme</div>
                                        <div class="small text-muted">Nakit veya Kredi Kartı ile kapıda güvenle ödeyin.
                                        </div>
                                    </div>
                                </div>

                                <button id="pay-btn" class="btn btn-block">
                                    SİPARİŞİ TAMAMLA
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </main>
    </div>

    <div id="toast" class="toast-premium">
        <span id="toast-message"></span>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function showToast(message, isError = true) {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toast-message');
            msg.textContent = message;
            toast.className = `toast-premium ${isError ? 'toast-error' : 'toast-success'} show`;
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function renderItems() {
            const container = document.getElementById('checkout-items');
            const totalSpan = document.getElementById('total-amount');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `
                <div class="text-center py-5">
                    <img src="https://illustrations.popsy.co/emerald/shopping-cart.svg" style="height: 180px;" class="mb-4">
                    <h4 class="font-weight-bold">Sepetiniz Boş!</h4>
                    <p class="text-muted">Ödeme yapmak için önce sepetinize ürün eklemelisiniz.</p>
                    <a href="/home" class="btn btn-primary px-4 py-2 mt-3" style="border-radius: 12px;">Ürünlere Göz At</a>
                </div>
            `;
                totalSpan.textContent = "0.00 ₺";
                document.getElementById('pay-btn').disabled = true;
                return;
            }

            let total = 0;
            cart.forEach(item => {
                total += item.price * item.quantity;
                container.innerHTML += `
                <div class="cart-item-premium">
                    <div class="d-flex align-items-center">
                        <div class="item-icon mr-3">
                            <i class="fas fa-box"></i>
                        </div>
                        <div>
                            <h6 class="font-weight-bold mb-0">${item.name}</h6>
                            <span class="text-muted small">${item.quantity} Adet × ${item.price.toFixed(2)} ₺</span>
                        </div>
                    </div>
                    <div class="font-weight-bold text-primary">${(item.price * item.quantity).toFixed(2)} ₺</div>
                </div>
            `;
            });
            totalSpan.textContent = `${total.toFixed(2)} ₺`;
        }

        async function completeOrder() {
            const btn = document.getElementById('pay-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>SİPARİŞ ALINIYOR...';

            try {
                const token = document.querySelector('meta[name="_csrf"]').content;
                const header = document.querySelector('meta[name="_csrf_header"]').content;

                const response = await fetch('/api/update-stock', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        [header]: token
                    },
                    body: JSON.stringify({ cart: cart })
                });

                const result = await response.json();

                if (response.ok) {
                    showToast('Siparişiniz başarıyla alındı! Yönlendiriliyorsunuz...', false);
                    localStorage.removeItem('cart');
                    setTimeout(() => window.location.href = '/checkout/success', 2000);
                } else {
                    btn.disabled = false;
                    btn.innerHTML = originalText;

                    let errorMsg = result.message || 'Bir hata oluştu.';
                    if (result.errors && result.errors.length > 0) {
                        errorMsg = result.errors.join(' | ');
                    }
                    showToast(errorMsg);
                }
            } catch (error) {
                btn.disabled = false;
                btn.innerHTML = originalText;
                showToast('Sunucuya ulaşılamadı. Lütfen internetinizi kontrol edin.');
                console.error(error);
            }
        }

        document.getElementById('pay-btn').addEventListener('click', completeOrder);
        renderItems();
    </script>

</body>

</html>
