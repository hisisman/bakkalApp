<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üye Ol - Bakkal App Premium</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #0f172a;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo i {
            transform: rotate(-10deg);
            margin-right: 12px;
        }

        .form-label {
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 15px;
            color: white;
            height: 50px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            color: white;
        }

        .btn-premium {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.2);
        }

        .btn-premium:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 50px rgba(16, 185, 129, 0.3);
            background: var(--primary-dark);
            color: white;
        }

        .invalid-feedback {
            display: block;
            color: #ef4444;
            font-size: 0.8rem;
            margin-top: 5px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="register-card">
        <div class="brand-logo">
            <i class="fas fa-shopping-basket"></i>BAKKAL
        </div>

        <h3 class="text-white font-weight-bold mb-2 text-center">Hesap Oluştur</h3>
        <p class="text-muted mb-4 text-center">Bakkal App premium dünyasına katılın.</p>

        <form th:action="@{/register}" method="POST" th:object="${user}">
            <div class="row">
                <div class="col-md-6 form-group mb-3">
                    <label class="form-label">Ad Soyad</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="col-md-6 form-group mb-3">
                    <label class="form-label">Kullanıcı Adı</label>
                    <input type="text" th:field="*{username}" class="form-control" placeholder="johndoe"
                        th:classappend="${usernameError} ? 'is-invalid'" required>
                    <div th:if="${usernameError}" class="invalid-feedback" th:text="${usernameError}"></div>
                </div>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">E-posta</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="john@example.com" required>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Telefon</label>
                <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="0500 000 00 00" required>
            </div>

            <div class="form-group mb-3">
                <label class="form-label">Adres</label>
                <textarea th:field="*{address}" class="form-control"
                    placeholder="Mahalle, Sokak, No... Adresinizi buraya girin."
                    style="height: auto; min-height: 80px;"></textarea>
            </div>

            <div class="form-group mb-4">
                <label class="form-label">Şifre</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
            </div>

            <input type="hidden" th:field="*{role}" value="USER">

            <button type="submit" class="btn-premium">Kayıt Ol</button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted">Zaten hesabınız mı var? <a th:href="@{/login}"
                    class="text-primary font-weight-bold">Giriş Yap</a></p>
        </div>
    </div>

</body>

</html>
