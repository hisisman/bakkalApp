<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim - Bakkal App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="Hesap bilgilerinizi görüntüleyin ve adres bilgilerinizi yönetin.">
    <style>
        :root {
            --primary: #10b981;
            --bg: #f8fafc;
            --text-dark: #0f172a;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-dark);
            padding-top: 100px;
        }

        .profile-card {
            background: white;
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .info-group {
            margin-bottom: 25px;
        }

        .info-label {
            color: #64748b;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .btn-back {
            background: var(--primary);
            color: white;
            border-radius: 12px;
            padding: 10px 25px;
            font-weight: 700;
            border: none;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg fixed-top bg-white border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand font-weight-bold text-primary" href="/home">BAKKAL</a>
            <a href="/home" class="btn btn-link text-dark font-weight-bold"><i class="fas fa-chevron-left mr-2"></i>Geri
                Dön</a>
        </div>
    </nav>
    <main>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="profile-card">
                        <div class="text-center mb-5">
                            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center"
                                style="width: 100px; height: 100px; font-size: 3rem;">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <h1 class="mt-4 font-weight-bold" style="font-size: 2rem;" th:text="${user.name}">Kullanıcı
                                Adı</h1>
                            <span class="badge badge-pill badge-light px-3 py-2 text-primary font-weight-bold"
                                th:text="${user.role}">USER</span>
                        </div>

                        <div class="row">
                            <div class="col-md-6 info-group">
                                <div class="info-label">Kullanıcı Adı</div>
                                <div class="info-value" th:text="${user.username}">username</div>
                            </div>
                            <div class="col-md-6 info-group">
                                <div class="info-label">Adres</div>
                                <div class="info-value text-primary" th:text="${user.address ?: 'Adres belirtilmemiş'}">
                                    Atatürk Mah. No:123</div>
                            </div>
                            <div class="col-md-6 info-group">
                                <div class="info-label">E-posta</div>
                                <div class="info-value" th:text="${user.email}">email@example.com</div>
                            </div>
                            <div class="col-md-6 info-group">
                                <div class="info-label">Telefon Numarası</div>
                                <div class="info-value" th:text="${user.phoneNumber}">0500 000 0000</div>
                            </div>
                            <div class="col-md-6 info-group">
                                <div class="info-value text-muted small">Kayıtlı kullanıcı</div>
                            </div>
                        </div>

                        <div class="mt-5 text-center">
                            <a href="/profile/edit" class="btn btn-outline-primary px-4 py-2 mr-2"
                                style="border-radius: 12px;">Profili Düzenle</a>
                            <form th:action="@{/logout}" method="POST" class="d-inline">
                                <button type="submit" class="btn btn-outline-danger px-4 py-2"
                                    style="border-radius: 12px;">Çıkış Yap</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
